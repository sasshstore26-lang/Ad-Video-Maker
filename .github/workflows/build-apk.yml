name: Build Adworks debug APK

on:
  push:
    branches: [main]
    paths:
      - "adworks-repo/apk/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adworks-repo/apk
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Assemble debug APK
        working-directory: adworks-repo/apk/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adworks-debug-apk
          path: adworks-repo/apk/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
